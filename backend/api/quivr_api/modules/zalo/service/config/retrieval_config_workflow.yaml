workflow_config:
  name: "standard RAG"
  nodes:
    - name: "START"
      edges: ["filter_history"]

    - name: "filter_history"
      edges: ["rewrite"]

    - name: "rewrite"
      edges: ["retrieve"]

    - name: "retrieve"
      edges: ["generate_rag"]

    - name: "generate_rag" # the name of the last node, from which we want to stream the answer to the user, should always start with "generate"
      edges: ["END"]
# Maximum number of previous conversation iterations
# to include in the context of the answer
max_history: 10

prompt: "my prompt"

max_files: 20
reranker_config:
  # The reranker supplier to use
  supplier: "cohere"

  # The model to use for the reranker for the given supplier
  model: "rerank-v3.5"

  # Number of chunks returned by the reranker
  top_n: 30
llm_config:
  max_input_tokens: 10000

  # Maximum number of tokens to pass to the LLM
  # as a context to generate the answer
  max_output_tokens: 10000

  temperature: 0.1
  streaming: true
