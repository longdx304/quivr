ingestion_config:
  parser_config:
    megaparse_config:
      strategy: 'fast'
      pdf_parser: 'unstructured'
    splitter_config:
      # Enhanced chunking for better context
      chunk_size: 600 # Increased from 400 for better context retention
      chunk_overlap: 150 # Increased overlap for better continuity
      chunking_strategy: 'enhanced_semantic' # Use enhanced semantic chunking

retrieval_config:
  # Maximum number of previous conversation iterations
  # to include in the context of the answer
  max_history: 8 # Optimized for recent relevant context

  max_files: 25 # Increased for more comprehensive search

  # Enhanced similarity search parameters
  similarity_threshold: 0.6 # Minimum relevance threshold
  context_quality_threshold: 0.7 # Minimum quality for chunk inclusion

  reranker_config:
    # The reranker supplier to use
    supplier: 'cohere'

    # The model to use for the reranker for the given supplier
    model: 'rerank-multilingual-v3.0'

    # Enhanced number of chunks for better reranking
    top_n: 8 # Increased from 5 for more comprehensive analysis
  llm_config:
    # The LLM supplier to use
    supplier: 'openai'

    # The model to use for the LLM for the given supplier
    model: 'gpt-3.5-turbo-0125'

    # Enhanced token limits for better context
    max_input_tokens: 3000 # Increased for larger context

    # Maximum number of tokens to pass to the LLM
    # as a context to generate the answer
    max_output_tokens: 2000 # Maintained for detailed responses

    # Lower temperature for more consistent, accurate responses
    temperature: 0.1
    streaming: true

  # Quality enhancement features
  quality_enhancements:
    enable_query_expansion: true
    enable_context_verification: true
    enable_source_attribution: true
    enable_response_validation: true
    enable_advisory_mode: true
    enable_structured_formatting: true

  # Advisory response configuration
  advisory_config:
    enable_analysis_section: true
    enable_recommendations: true
    enable_considerations: true
    enable_next_steps: true
    enable_comparative_analysis: true

  # Formatting configuration
  formatting_config:
    enable_markdown: true
    enable_tables: true
    enable_structured_headings: true
    enable_bullet_points: true
    enable_code_blocks: true
    enable_emphasis: true
