services:
  # SQL Server Data Warehouse
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourPassword123!
      - MSSQL_PID=Express
    ports:
      - '1433:1433'
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./sql_scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -Q 'SELECT 1' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - etl-network

  # ETL Application
  etl-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Supabase Configuration (Source)
      - SUPABASE_HOST=host.docker.internal # Points to host machine
      - SUPABASE_PORT=54322
      - SUPABASE_DATABASE=postgres
      - SUPABASE_USER=postgres
      - SUPABASE_PASSWORD=postgres
      - SUPABASE_SCHEMA=public

      # SQL Server Configuration (Target)
      - SQLSERVER_HOST=sqlserver
      - SQLSERVER_PORT=1433
      - SQLSERVER_DATABASE=DataWarehouse
      - SQLSERVER_USER=sa
      - SQLSERVER_PASSWORD=YourPassword123!
      - SQLSERVER_DRIVER=ODBC Driver 18 for SQL Server

      # ETL Configuration
      - BATCH_SIZE=1000
      - LOG_LEVEL=INFO
      - SYNC_INTERVAL_MINUTES=60
      - MAX_RETRIES=3
      - RETRY_DELAY=5
      - PARALLEL_WORKERS=4
      - CONNECTION_POOL_SIZE=10

      # Optional: Email Notifications
      # - ETL_SMTP_SERVER=smtp.gmail.com
      # - ETL_SMTP_PORT=587
      # - ETL_SMTP_USERNAME=your-email@gmail.com
      # - ETL_SMTP_PASSWORD=your-app-password
      # - ETL_FROM_EMAIL=your-email@gmail.com
      # - ETL_TO_EMAILS=admin1@company.com,admin2@company.com

      # Optional: Slack Notifications
      # - ETL_SLACK_WEBHOOK_URL=https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK

    volumes:
      - etl_logs:/app/etl_logs
      - etl_reports:/app/etl_reports
      - ./config:/app/config # Mount config directory for overrides

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - etl-network

    # Restart policy for production
    restart: unless-stopped

    # Health check for ETL application
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'from utils import get_database_health; print(get_database_health())',
        ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Optional: ETL Web Interface (for monitoring)
  etl-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - SQLSERVER_HOST=sqlserver
      - SQLSERVER_PORT=1433
      - SQLSERVER_DATABASE=DataWarehouse
      - SQLSERVER_USER=sa
      - SQLSERVER_PASSWORD=YourPassword123!
    ports:
      - '8080:8080'
    depends_on:
      - sqlserver
      - etl-app
    networks:
      - etl-network
    profiles:
      - monitoring # Optional service, enable with: docker compose --profile monitoring up

# Named volumes for persistence
volumes:
  sqlserver_data:
    driver: local
  etl_logs:
    driver: local
  etl_reports:
    driver: local

# Network for service communication
networks:
  etl-network:
    driver: bridge
