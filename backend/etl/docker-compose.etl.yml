services:
  # SQL Server Data Warehouse
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourPassword123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./sql_scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    networks:
      - etl-network

  # ETL Application
  etl-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Supabase Configuration (Source) - Use environment variables with defaults
      - SUPABASE_HOST=${SUPABASE_HOST}
      - SUPABASE_PORT=${SUPABASE_PORT}
      - SUPABASE_DATABASE=${SUPABASE_DATABASE}
      - SUPABASE_USER=${SUPABASE_USER}
      - SUPABASE_PASSWORD=${SUPABASE_PASSWORD}
      - SUPABASE_SCHEMA=${SUPABASE_SCHEMA}

      # SQL Server Configuration (Target) - Use environment variables with defaults
      - SQLSERVER_HOST=${SQLSERVER_HOST}
      - SQLSERVER_PORT=${SQLSERVER_PORT}
      - SQLSERVER_DATABASE=${SQLSERVER_DATABASE}
      - SQLSERVER_USER=${SQLSERVER_USER}
      - SQLSERVER_PASSWORD=${SQLSERVER_PASSWORD}
      - SQLSERVER_DRIVER=${SQLSERVER_DRIVER}

      # ETL Configuration - Use environment variables with defaults
      - BATCH_SIZE=${BATCH_SIZE}
      - LOG_LEVEL=${LOG_LEVEL}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES}
      - MAX_RETRIES=${MAX_RETRIES}
      - RETRY_DELAY=${RETRY_DELAY}
      - PARALLEL_WORKERS=${PARALLEL_WORKERS}
      - CONNECTION_POOL_SIZE=${CONNECTION_POOL_SIZE}

      # Optional: Email Notifications (will use from .env if defined)
      - ETL_SMTP_SERVER=${ETL_SMTP_SERVER}
      - ETL_SMTP_PORT=${ETL_SMTP_PORT}
      - ETL_SMTP_USERNAME=${ETL_SMTP_USERNAME}
      - ETL_SMTP_PASSWORD=${ETL_SMTP_PASSWORD}
      - ETL_FROM_EMAIL=${ETL_FROM_EMAIL}

      # Optional: Slack Notifications (will use from .env if defined)
      - ETL_SLACK_WEBHOOK_URL=${ETL_SLACK_WEBHOOK_URL}

    volumes:
      - etl_logs:/app/etl_logs
      - etl_reports:/app/etl_reports
      - ./config:/app/config # Mount config directory for overrides

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - etl-network

    # Restart policy for production
    restart: unless-stopped

    # Health check for ETL application
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from utils import get_database_health; print(get_database_health())",
        ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

# Named volumes for persistence
volumes:
  sqlserver_data:
    driver: local
  etl_logs:
    driver: local
  etl_reports:
    driver: local

# Network for service communication
networks:
  etl-network:
    driver: bridge
