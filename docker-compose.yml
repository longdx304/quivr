services:
  frontend:
    image: frontend:latest
    pull_policy: never
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_ENV=local
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_CMS_URL=${NEXT_PUBLIC_CMS_URL}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
        - NEXT_PUBLIC_AUTH_MODES=${NEXT_PUBLIC_AUTH_MODES}
    container_name: web
    depends_on:
      - backend-api
    restart: always
    ports:
      - 3000:3000

  backend-api:
    image: backend-api:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    pull_policy: never
    env_file:
      - .env
    build:
      context: backend
      dockerfile: Dockerfile.dev
      cache_from:
        - backend-api:latest
      args:
        - DEV_MODE=true
    container_name: backend-api
    volumes:
      - ./backend/:/app/
    command: >
      /bin/bash -c "python -m uvicorn quivr_api.main:app --host 0.0.0.0 --log-level info --reload --port 5050"
    restart: always
    ports:
      - 5050:5050

  worker:
    pull_policy: never
    image: backend-api:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    container_name: worker
    volumes:
      - ./backend/:/app/
    command: >
      /bin/bash -c "python -m celery -A quivr_worker.celery_worker worker -l info -E -P solo"
    restart: always
    depends_on:
      - redis

  notifier:
    pull_policy: never
    image: backend-api:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    container_name: notifier
    volumes:
      - ./backend/:/app/
    command: >
      /bin/bash -c "python /app/worker/quivr_worker/celery_monitor.py"
    restart: always
    depends_on:
      - redis
      - worker

  beat:
    image: backend-api:latest
    pull_policy: never
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    container_name: beat
    command: >
      /bin/bash -c "python -m celery -A quivr_worker.celery_worker beat -l info"
    volumes:
      - ./backend/:/app/
    restart: always
    depends_on:
      - redis

  flower:
    image: backend-api:latest
    pull_policy: never
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    container_name: flower
    command: >
      /bin/bash -c "python -m celery -A quivr_worker.celery_worker flower -l info --port=5555"
    volumes:
      - ./backend/:/app/
    restart: always
    depends_on:
      - redis
      - worker
      - beat
    ports:
      - 5555:5555

  redis:
    image: redis:latest
    container_name: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    ports:
      - 6379:6379

  # Enhanced Nginx Authentication Proxy cho Supabase Studio
  nginx-auth-proxy:
    build:
      context: ./nginx-auth
      dockerfile: Dockerfile
    container_name: nginx-auth-proxy
    ports:
      - "54323:54323"
    environment:
      - ADMIN_USERNAME=${AUTH_ADMIN_USERNAME}
      - ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD}
      - SECRET_KEY=${AUTH_SECRET_KEY:-enhanced-secret-key-for-session-management}
      - SESSION_TIMEOUT=${AUTH_SESSION_TIMEOUT:-3600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:54323/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
