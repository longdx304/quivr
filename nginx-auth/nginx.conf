events {
    worker_connections 1024;
}

http {
    upstream supabase_studio {
        server host.docker.internal:54325;
    }
    
    upstream auth_service {
        server 127.0.0.1:5000;
    }

    server {
        listen 54323;
        server_name localhost;

        # Internal auth endpoint for nginx auth_request
        location = /auth/verify {
            internal;
            proxy_pass http://auth_service;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # Auth endpoints (login/logout/status)
        location ~ ^/auth(?!/verify) {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Session status endpoint 
        location /session {
            auth_request /auth/verify;
            proxy_pass http://auth_service/auth/status;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Session widget JavaScript (no auth required)
        location /session-widget.js {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Universal auto-loader (no auth required)
        location /auto-loader.js {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Auto-inject widget on main dashboard
        location ~ ^/project/default {
            auth_request /auth/verify;
            error_page 401 = @error401;
            
            # Disable compression for sub_filter to work
            proxy_set_header Accept-Encoding "";
            
            proxy_pass http://supabase_studio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Force response buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # Add header to trigger auto-loading
            add_header X-Widget-Auto-Load "true";
            
            # Simple but effective injection
            sub_filter_once off;
            sub_filter '<head>' '<head><script>if(!window.widgetInjected){window.widgetInjected=true;setTimeout(()=>{fetch("/session-widget.js").then(r=>r.text()).then(eval).catch(console.error)},1000);}</script>';
            sub_filter_types text/html application/javascript;
        }

        # Widget auto-loader for any missed pages  
        location /widget-autoload.js {
            auth_request /auth/verify;
            add_header Content-Type "application/javascript";
            add_header Cache-Control "no-cache";
            return 200 'if(!window.sessionWidget||!window.sessionWidget.isActive){console.log("Auto-loading session widget...");fetch("/session-widget.js").then(r=>r.text()).then(eval).catch(e=>console.error("Widget load failed:",e));}';
        }

        # Health check endpoint (no auth required)
        location /health {
            return 200 "Nginx + Auth Service OK\n";
            add_header Content-Type text/plain;
        }

        # Logout redirect
        location /logout {
            return 302 /auth/logout;
        }

        # Main proxy to Supabase Studio (requires authentication)
        location / {
            # Check authentication first
            auth_request /auth/verify;
            
            # If not authenticated, redirect to login
            error_page 401 = @error401;
            
            # Proxy to Supabase Studio
            proxy_pass http://supabase_studio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Add trigger header for client-side detection
            add_header X-Session-Widget-Available "true";
        }
        
        # Handle authentication errors
        location @error401 {
            return 302 /auth;
        }
    }
} 